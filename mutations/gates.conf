# Mutation spec for customfield_repeatable — run with
# `mdl mutate moodle-customfield_repeatable /Users/uaiblaine/dev/moodle-customfield_repeatable/mutations/gates.conf --fast --db pgsql`
# and again with `--db mariadb`.
#
# Each gate breaks ONE guard and names the test(s) that must go red because of it. A gate with no
# `->` line is one the author expects NO test (or no test on every database) to hold: its result is
# the finding, not a pass. Gates marked `# needs local_dictionaries` are held by tests that skip
# without that companion: judge them from a leg that installs it (ci.yml does).
#
# The engine's own rules (schema, validator, widget, column editor, renderer, projector) are gated in
# local_repeatable's mutations/gates.conf; these gates hold the adapter to the facts it hands the engine.
#
#     tag | file relative to the repo | perl script relative to this file

